name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Least privilege: read the code, publish to Pages. No secrets are used anywhere.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older run that is still building.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uses the lockfile when it exists (reproducible); falls back to a normal
      # install for the very first run, before package-lock.json is committed.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check contact links and content integrity
        run: npm run check

      - name: Type-check and build
        run: npm run build

      # Guard against the classic GitHub Pages failure: assets requested from "/"
      # instead of "/Portofolio.Omar/".
      - name: Verify the base path in the built output
        run: |
          grep -q '/Portofolio.Omar/assets/' dist/index.html || {
            echo "Built index.html does not reference /Portofolio.Omar/assets/ — check 'base' in vite.config.ts"
            exit 1
          }
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Found root-relative /assets/ references in dist/index.html"
            exit 1
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
